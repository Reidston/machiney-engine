# =============================================================================
# MachineY Engine (机器小乙·引擎) — WSL Distribution Metadata
# Defines OOBE behavior, default user, and Windows Terminal appearance
# See: https://learn.microsoft.com/en-us/windows/wsl/build-custom-distro
# =============================================================================

[oobe]
command = /etc/oobe.sh
defaultUid = 1000
defaultName = machiney-engine

[shortcut]
enabled = true
icon = /usr/share/icons/machiney.png

[windowsterminal]
enabled = true
