# =============================================================================
# OpenClaw WSL Distribution — WSL Configuration
# Security-hardened: No Windows filesystem access, no interop
# =============================================================================

[boot]
systemd = true

[automount]
# SECURITY: Disable Windows filesystem mount to prevent host file access
enabled = false
mountFsTab = false

[interop]
# SECURITY: Disable WSL → Windows executable calls to prevent lateral movement
enabled = false
appendWindowsPath = false

[user]
# Initial value is root so OOBE can create claw_agent user.
# oobe.sh Step 3 changes this to claw_agent after creation.
default = root

[network]
generateHosts = true
# STABILITY: Disable auto-generated resolv.conf — WSL2's virtual DNS forwarder
# (10.255.255.254) is unreliable after sleep/network changes, causing EAI_AGAIN
# errors. Static resolv.conf with public DNS is injected by Dockerfile instead.
generateResolvConf = false
